name: End to end Tests
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "docs/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.3
      - name: Build binary for integration tests
        run: go build -a ./cmd/bearer/bearer.go
      - name: Run tests
        run: go test -v ./e2e/... -p 8
        timeout-minutes: 10
        env:
          USE_BINARY: true
